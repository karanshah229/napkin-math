schema_version: "1.1"
name: s3-vs-nvme-scan
expected_outcome: |
  Per instance: S3 ~3-6 h at ~3 GiB/s, local NVMe ~1-3 h at ~5 GiB/s (50 TB needs more than one 48-vCPU box), EBS ~7-13 h at ~1-2 GB/s. Per scan costs are tens of dollars, but keeping 50 TB on NVMe or EBS costs thousands per month, so S3 (scaled out across instances if needed) wins.
