schema_version: "1.1"
name: cross-region-backup-copy
expected_outcome: |
  Explains that one TCP stream with default Linux buffers moves only a few MiB per ~200 ms round trip, so the single scp takes days, and that raising TCP buffers plus many parallel streams brings it to around an hour, bounded by the VM's bandwidth (half of it leaves the region on AWS) and then by disk throughput, and that sending only changes cuts the data itself.
